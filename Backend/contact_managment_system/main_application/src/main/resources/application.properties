spring.application.name=Contact Management System Backend
server.port=${PORT:8080}

# Database Configuration (supports standard Spring and generic DB environment variables, falls back to H2)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:mem:contactdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DB_DRIVER:org.h2.Driver}}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration (Must be >= 32 characters)
jwt.secret=${JWT_SECRET:c2VjdXJlLVJhbmRvbS1TZWNyZXQtS2V5LUZvci1DVVMtQXBwbGljYXRpb24tMjU2Yml0cw==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.cookie.name=${JWT_COOKIE_NAME:cms_auth_token}
jwt.cookie.secure=${JWT_COOKIE_SECURE:true}
jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:None}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# H2 Console is disabled by default in production
spring.h2.console.enabled=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.contact_managment.main_application=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
