# Application Configuration
spring.application.name=main_application
spring.profiles.active=dev

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# DataSource Configuration - Replace with actual credentials for production
# For local development with H2 fallback or SQL Server
spring.datasource.url=${DB_URL:jdbc:h2:mem:contactdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Validation and Error Handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Logging Configuration - Enterprise SLF4J/Logback setup
logging.level.root=INFO
logging.level.com.contact_managment.main_application=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Jackson Configuration - Prevent null issues
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

