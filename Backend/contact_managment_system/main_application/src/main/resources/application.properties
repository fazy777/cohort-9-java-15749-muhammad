spring.application.name=Contact Management System Backend
server.port=${PORT:8080}

# Microsoft SQL Server Configuration Template (Production)
# spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:ContactDB};encrypt=true;trustServerCertificate=false
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.datasource.username=${DB_USERNAME:sa}
# spring.datasource.password=${DB_PASSWORD:}
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Default Profile & JPA Configuration
spring.profiles.default=dev
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration (Must be provided in production via JWT_SECRET environment variable)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# H2 Console is disabled by default in production
spring.h2.console.enabled=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.contact_managment.main_application=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
