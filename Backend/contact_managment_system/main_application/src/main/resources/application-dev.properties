# Development Profile Configuration: H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:contactdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Development JWT Secret (provide via JWT_SECRET environment variable or configure locally)
jwt.secret=${JWT_SECRET:}

# Explicit development-only override for local HTTP development (allows non-HTTPS localhost)
jwt.cookie.secure=false

# Development CORS Configuration (allows local frontend dev servers)
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173

