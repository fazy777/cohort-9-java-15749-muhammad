<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sphereGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="45%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#fca5a5" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Brand Badge -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#sphereGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="18" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Orbital Ring forming the Sphere -->
  <ellipse cx="32" cy="32" rx="21" ry="8.5" stroke="url(#ringGrad)" stroke-width="2.6" transform="rotate(-25 32 32)" />
  
  <!-- Central Sphere Body -->
  <circle cx="32" cy="32" r="14" fill="#140205" fill-opacity="0.35" stroke="#ffffff" stroke-width="2.4" />
  
  <!-- Contact / User Emblem Inside Central Sphere -->
  <circle cx="32" cy="26" r="4.5" fill="#ffffff" />
  <path d="M23 39c0-4.5 4-7 9-7s9 2.5 9 7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Orbital Connection Nodes -->
  <circle cx="49" cy="24" r="3.2" fill="#ffffff" />
  <circle cx="15" cy="40" r="2.6" fill="#ffffff" />
</svg>
